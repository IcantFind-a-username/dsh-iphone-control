<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./static/style.css?v=4">
<title>Pocket · DeepSeek Harness</title>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="top">
  <button class="icon" id="btnSessions" aria-label="会话列表">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h10"/>
    </svg>
  </button>
  <div class="titles">
    <h1 id="title">Pocket</h1>
    <p id="sub"><span class="dot" id="dot"></span><span id="subText">正在连接…</span></p>
  </div>
  <button class="icon" id="btnNew" aria-label="新会话">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
</header>

<main id="scroller">
  <div id="log" class="log"></div>
</main>

<button id="jump" class="jump" hidden>
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
  <span>最新</span>
</button>

<footer id="composer" class="composer">
  <div class="previews" id="previews" hidden></div>
  <div class="bar">
    <button class="round ghost" id="btnAttach" aria-label="添加照片">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
    <button class="round send" id="btnSend" aria-label="发送" disabled>
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M6 11l6-6 6 6"/>
      </svg>
    </button>
    <button class="round stop" id="btnStop" aria-label="停止" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
    </button>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2>会话</h2>
      <button class="text-btn" id="btnNewSheet">新会话</button>
    </div>
    <div class="sheet-list" id="sessionList"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="./static/app.js?v=4"></script>
</body>
</html>
