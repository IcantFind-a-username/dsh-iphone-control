<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080B">
<title>配对 · Pocket</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center;
    padding: 28px;
    background: #07080b;
    color: #edeef3;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .glow {
    position: fixed; inset: -20% -20% auto -20%; height: 55vh;
    background: radial-gradient(50% 60% at 20% 0%, rgba(92,124,255,.30), transparent 70%),
                radial-gradient(45% 55% at 85% -5%, rgba(160,107,255,.22), transparent 70%);
    filter: blur(10px); pointer-events: none;
  }
  .card {
    position: relative;
    width: min(420px, 100%);
    background: rgba(18,20,27,.82);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 26px;
    padding: 26px 22px 22px;
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  .orb {
    width: 54px; height: 54px; border-radius: 50%;
    background: conic-gradient(from 140deg, #5d7dff, #a06bff, #4ed0c8, #5d7dff);
    box-shadow: 0 0 44px rgba(110,130,255,.5), inset 0 0 18px rgba(255,255,255,.35);
    margin-bottom: 16px;
  }
  h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -0.02em; }
  p { margin: 0 0 18px; color: #8b90a0; font-size: 13.5px; }
  input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.045);
    color: #edeef3;
    font: inherit;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: rgba(111,139,255,.6); }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(140deg, #5d7dff, #8d5cff);
    color: #fff;
    font: inherit;
    font-weight: 600;
    box-shadow: 0 10px 26px rgba(93,125,255,.32);
  }
  button:active { transform: scale(.985); }
  .hint { margin-top: 14px; font-size: 12px; color: #666b7a; line-height: 1.55; }
  code { font-family: ui-monospace, Menlo, monospace; color: #9aa0ae; }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="card">
  <div class="orb"></div>
  <h1>配对这台 Mac</h1>
  <p>Pocket 需要一次性配对令牌，令牌只保存在你的电脑上。</p>
  <input id="token" placeholder="粘贴配对令牌" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="go">连接</button>
  <div class="hint">
    令牌在 <code>~/.dsh/pocket/state.json</code> 里，或者直接在电脑上打开带
    <code>?token=…</code> 的链接。
  </div>
</div>
<script>
  const go = () => {
    const value = document.getElementById('token').value.trim();
    if (!value) return;
    location.replace(`./?token=${encodeURIComponent(value)}`);
  };
  document.getElementById('go').addEventListener('click', go);
  document.getElementById('token').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') go();
  });
</script>
</body>
</html>
